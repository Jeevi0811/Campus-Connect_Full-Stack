<style>
  body { font-family: Arial; background: #eef2f5; }
  .login-box {
    width: 300px;
    margin: 80px auto;         /* centers box horizontally */
    padding: 25px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  .login-box input {
    width: 100%;
    padding: 8px;
    margin: 8px 0;
    box-sizing: border-box;
  }
  .login-box button {
    width: 100%;
    padding: 10px;
    background: #1F3B5C;
    color: white;
    border: none;
    border-radius: 4px;
  }
</style>
<div class="login-box">
  <h2>Login</h2>
  <input type="text" placeholder="Username"/>
  <input type="password" placeholder="Password"/>
  <button>Login</button>
</div>
